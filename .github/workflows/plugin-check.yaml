name: build-test

on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Install dependencies
        run: |
          npm ci
          composer install --prefer-dist --no-interaction

      - name: Run WordPress coding standards
        run: npm run check

      - name: Verify PHP 7.2 compatibility
        run: npm run compat

      - name: Run unit tests
        run: npm run test

      - name: Build release package
        run: npm run dist

      - name: Extract release package for Plugin Check
        run: |
          mkdir plugin-check-build
          unzip oneclickcontent-images.zip -d plugin-check-build

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './plugin-check-build/occidg'

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout code (full history & tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Install dependencies
        run: |
          npm ci
          composer install --no-dev --optimize-autoloader

      - name: Create clean ZIP
        run: npm run dist

      - name: Extract ZIP to deploy directory
        run: |
          rm -rf dist dist-package
          mkdir dist dist-package
          unzip oneclickcontent-images.zip -d dist-package
          top_level="$(find dist-package -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          cp -R "$top_level"/. dist/

      - name: Deploy to WP.org SVN
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.WPORG_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
          SLUG: occidg
          BUILD_DIR: dist
          ASSETS_DIR: assets
